name: krishna_sanjeevani
description: "Krishna Sanjeevani - Curative Audio Therapy Flutter Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.0

  # Navigation & Routing
  go_router: ^14.0.0

  # Networking & Storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0

  # Audio & Streaming
  just_audio: ^0.9.40
  audio_service: ^0.18.15

  # Authentication
  google_sign_in: ^7.0.0
  razorpay_flutter: ^1.3.7

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/

